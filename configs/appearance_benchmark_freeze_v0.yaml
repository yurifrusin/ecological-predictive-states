  control_profile_id: revision1_checker_low_v1
  interpretation: frequency_only_relative_to_checker_low
scene_families:
  - scene_family: single_occluder
    config_path: configs/benchmark_v0.yaml
    config_logical_sha256: 656eda0f17cc1c8e2959e36f39ed16aa33d55d1a0fd99380363e4ec48a1c2a29
  - scene_family: corridor
    config_path: configs/corridor_v0.yaml
    config_logical_sha256: 6d3840824e22c2656e3188cbcb74108a1beb0bdac27a25c4cfd75a81793e10a2
admission_thresholds:
  changed_controlled_pixel_fraction_minimum: 0.2
  normalized_controlled_rgb_mad_minimum: 0.025
  visible_surface_mean_luminance_minimum: 0.05
  visible_surface_mean_luminance_maximum: 0.95
  textured_surface_minimum_pixels: 100
  textured_surface_luminance_std_minimum: 0.025
  frequency_partner_minimum_ratio: 4.0
pairing_policy:
  pair_key_fields: [scene_family, evaluation_episode_root]
  identical_apparatus_fields:
    - sampled_geometry
    - camera_trajectory
    - executed_action
    - surface_remapping
    - scene_content_identity
    - analytic_transport
    - oriented_boundary_ownership
    - visibility_events
    - public_occlusion_relation
  primary_reference_rule: every_selected_ood_uses_balanced_reference_same_scene_and_root
  candidate_admission_control_rule: preserve_revision1_matched_control_same_scene_and_root
  secondary_diagnostic_rule: checker_high_versus_checker_low_same_scene_and_root
evaluation_use_policy:
  public_evaluation_roots_are_evaluation_only: true
  public_does_not_mean_development_eligible: true
  held_out_ood_profiles_are_evaluation_only: true
  development_reference_is_sole_training_appearance_eligible_profile: true
  training_on_final_evaluation_roots_prohibited: true
  tuning_on_final_evaluation_roots_prohibited: true
  checkpoint_selection_from_final_evaluation_results_prohibited: true
  held_out_ood_training_or_tuning_prohibited: true
  post_result_role_changes_prohibited: true
  difficult_root_replacement_prohibited: true
  original_design_roots_posture: apparatus_design_evidence_not_automatically_training
  revision1_qualification_roots_posture: candidate_qualification_evidence_not_automatically_training
  training_episode_roots: null
  validation_episode_roots: null
  model_random_seeds: null
renderer_policy:
  supported_apparatus_environments:
    - environment_id: windows_wgl_locked
      fingerprint:
        mujoco_version: 3.12.0
        numpy_version: 2.4.6
        renderer: mujoco.Renderer
        backend: wgl-default
        operating_system: Windows
    - environment_id: ubuntu_osmesa_locked
      fingerprint:
        mujoco_version: 3.12.0
        numpy_version: 2.4.6
        renderer: mujoco.Renderer
        backend: osmesa
        operating_system: Linux
  every_selected_profile_all_cells_both_environments_required: true
  portable_apparatus_roots_must_match: true
  renderer_local_roots_are_reported_not_compared: true
  renderer_specific_profiles_or_thresholds_prohibited: true
  portable_identity_backend_dispatch_prohibited: true
  primary_model_result_renderer: null
  primary_model_result_renderer_posture: deferred_to_gate_0d_0e
failure_policy:
  selected_profile_set_is_indivisible: true
  any_selected_cell_failure_makes_candidate_not_ready: true
  any_locked_renderer_failure_makes_candidate_not_ready: true
  failed_seed_set_disposition: retired_after_failed_freeze_qualification
  successful_seed_set_disposition: eligible_for_owner_freeze_if_approved
  failed_roots_may_not_be_reused_for_revised_profiles: true
  future_revised_profile_set_requires_owner_authorised_root_and_namespace: true
freeze_scope:
  checkpoint_fields:
    - appearance_profile_roles
    - selected_and_excluded_profile_identities
    - evaluation_episode_roots
    - scene_families
    - pairing_rules
    - appearance_admission_criteria
    - training_evaluation_exclusion_policy
    - supported_apparatus_renderer_environments
    - portable_and_renderer_local_identity_posture
  deferred_gate_0d_0e_fields:
    - normative_primary_model_result_renderer
    - model_families_and_implementations
    - model_random_seeds
    - training_episode_roots
    - validation_episode_roots
    - training_set_size
    - optimiser_and_learning_rate_schedule
    - parameter_and_compute_budgets
    - checkpoint_selection
    - statistical_and_bootstrap_implementation
    - stopping_rules
    - empirical_gate_decision
  complete_experimental_preregistration: false
  benchmark_frozen: false
  model_protocol_frozen: false
  full_gate_0b_complete: false
  gate_0c_authorised: false
  gate_0d_authorised: false
  scientific_result: null
