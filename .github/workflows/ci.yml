name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install offscreen rendering libraries
        run: sudo apt-get update && sudo apt-get install --yes libgl1-mesa-dri libglfw3 libosmesa6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked Python environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

      - name: Exercise dataset commands
        run: |
          uv run epsbench generate --config configs/benchmark_v0.yaml --episodes 2 --output data/ci-smoke
          uv run epsbench validate data/ci-smoke
          uv run epsbench inspect data/ci-smoke --episode 0 --output artifacts/ci-episode-0.png
