name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install offscreen rendering libraries
        run: sudo apt-get update && sudo apt-get install --yes libgl1-mesa-dri libglfw3 libosmesa6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked Python environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

      - name: Exercise both scene families and print transport boundary event identities
        run: |
          uv run epsbench generate --config configs/benchmark_v0.yaml --episodes 2 --output data/ci-smoke
          uv run epsbench validate data/ci-smoke
          uv run epsbench inspect data/ci-smoke --episode 0 --output artifacts/ci-episode-0.png
          uv run epsbench generate --config configs/corridor_v0.yaml --episodes 2 --output data/ci-corridor
          uv run epsbench validate data/ci-corridor
          uv run epsbench inspect data/ci-corridor --episode 0 --output artifacts/ci-corridor-episode-0.png

      - name: Audit the complete appearance candidate matrix
        run: |
          uv run epsbench appearance-audit \
            --registry configs/appearance_candidates_v0.yaml \
            --seeds configs/evaluation_seed_candidates_v0.yaml \
            --single-config configs/benchmark_v0.yaml \
            --corridor-config configs/corridor_v0.yaml \
            --output artifacts/gate-0b-slice-5-candidates
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          output = Path("artifacts/gate-0b-slice-5-candidates")
          packet = json.loads((output / "candidate_packet.json").read_text())
          roots = packet["roots"]
          cells = json.loads((output / "seed_matrix.json").read_text())["cells"]
          profiles = json.loads((output / "profile_summary.json").read_text())["profiles"]
          successful_cells = [cell for cell in cells if cell["generation_status"] == "success"]
          assert packet["schema_version"] == "appearance_candidate_audit_v2"
          assert packet["root_schema_version"] == "appearance_candidate_root_domains_v2"
          assert len(successful_cells) == 10 * 8 * 2, "every matrix cell must generate and validate"
          assert packet["matrix_counts"] == {"admitted": 44, "rejected": 116}
          assert all(profile["profile_admission_status"] == "rejected" for profile in profiles)
          assert packet["final_split"] is None
          assert packet["final_evaluation_seeds"] is None
          assert packet["contact_sheet_manifest"]["schema_version"] == (
              "appearance_contact_sheet_manifest_v1"
          )
          assert len(packet["contact_sheet_manifest"]["sheets"]) == 2
          for field in (
              "scene_content_sha256",
              "analytic_transport_sha256",
              "oriented_boundary_sha256",
              "visibility_event_sha256",
              "occlusion_sha256",
              "action_sha256",
              "ecological_label_sha256",
              "camera_trajectory_sha256",
              "geometry_sha256",
              "opaque_remapping_sha256",
          ):
              domain = [[cell["cell_id"], cell[field]] for cell in successful_cells]
              digest = hashlib.sha256(
                  json.dumps(domain, sort_keys=True, separators=(",", ":")).encode()
              ).hexdigest()
              print(f"{field} component root: {digest}")
          expected = {
              "appearance_registry_sha256": "f90feb3cf9d798ab61c3adbb8d2b276c5d2cb131b95c5a9187df151f9b801d60",
              "seed_registry_sha256": "6c6816ae1f6657a710631f08a435cca4c623e81efc71ac4e6330a44338313482",
              "procedural_asset_root_sha256": "6eb582b0c636e79349a11edab50394c26b15f07d55327cdd081ef999131b5724",
              "appearance_assignment_root_sha256": "10a24a068c80cd2b85ff00a55b4d0c5a02ba64617f97ac808a9417197bcea90d",
              "portable_analytic_identity_root_sha256": "2cb8b42739418faae9666dcb518de3e6655b9ee7f42c63c3acd337debcd224d5",
              "appearance_invariance_outcome_root_sha256": "2bc8edfe05b0401c48a8bc3d897e965c1925ec53dbdf4273d0ee60cc034b3cde",
          }
          assert all(roots[key] == value for key, value in expected.items()), (roots, expected)
          required_local_checks = (
              "structural_invariance",
              "portable_analytic_identity_equality",
              "ecological_label_equality",
              "depth_segmentation_invariance",
              "determinism",
          )
          assert all(
              all(cell["admission_checks"][check] for check in required_local_checks)
              for cell in successful_cells
          ), "a renderer-local appearance intervention changed matched-control structure"
          print("Exact cross-platform portable roots:", expected)
          print(
              "Renderer-local ecological-label root (reported, not compared):",
              roots["renderer_local_ecological_label_root_sha256"],
          )
          PY

      - name: Analyse the canonical negative evidence and validate the definition lock
        run: |
          uv run epsbench appearance-failure-analysis \
            --packet artifacts/gate-0b-slice-5-candidates \
            --output artifacts/appearance-revision1-analysis
          uv run python - <<'PY'
          import json
          from pathlib import Path

          from epsbench.revision import validate_definition_lock

          analysis = json.loads(
              Path("artifacts/appearance-revision1-analysis/baseline_failure_analysis.json")
              .read_text()
          )
          assert analysis["baseline_failure_analysis_sha256"] == (
              "8ff7374fb4ea0144687a4bda3b25ae3936c7b8b7f0d1ace35ce071d64328dea2"
          )
          lock = validate_definition_lock(
              Path("configs/appearance_candidates_v0.yaml"),
              Path("configs/evaluation_seed_candidates_v0.yaml"),
              Path("configs/appearance_candidates_revision1.yaml"),
              Path("configs/appearance_revision1_qualification_seeds_v0.yaml"),
              Path("configs/appearance_candidate_revision1_lock.json"),
              Path("configs/appearance_revision1_baseline_failure_analysis.json"),
          )
          assert lock["definition_lock_sha256"] == (
              "71d2ed7a9f45c55bf17ec518c08b5d0b827a7cf0ae2cc3c339dc09197c55f633"
          )
          print(
              "Renderer-specific baseline analysis root (reported, not compared):",
              analysis["renderer_specific_failure_analysis_sha256"],
          )
          PY

      - name: Qualify every locked Revision 1 profile in both seed partitions
        run: |
          uv run epsbench appearance-revision-audit \
            --baseline-registry configs/appearance_candidates_v0.yaml \
            --design-seeds configs/evaluation_seed_candidates_v0.yaml \
            --revision-registry configs/appearance_candidates_revision1.yaml \
            --qualification-seeds configs/appearance_revision1_qualification_seeds_v0.yaml \
            --definition-lock configs/appearance_candidate_revision1_lock.json \
            --single-config configs/benchmark_v0.yaml \
            --corridor-config configs/corridor_v0.yaml \
            --output artifacts/gate-0b-appearance-revision1
          uv run python - <<'PY'
          import json
          from pathlib import Path

          output = Path("artifacts/gate-0b-appearance-revision1")
          packet = json.loads((output / "revision1_candidate_packet.json").read_text())
          design = json.loads((output / "design_seed_matrix.json").read_text())["cells"]
          qualification = json.loads(
              (output / "qualification_seed_matrix.json").read_text()
          )["cells"]
          profiles = json.loads((output / "profile_summary.json").read_text())["profiles"]
          assert packet["freeze_status"] == "candidate_revision_packet_only_not_frozen"
          assert packet["final_split"] is None
          assert packet["final_evaluation_seeds"] is None
          assert packet["full_gate_0b_complete"] is False
          assert packet["benchmark_frozen"] is False
          assert len(design) == 112
          assert len(qualification) == 112
          assert len({cell["cell_id"] for cell in [*design, *qualification]}) == 224
          assert all(cell["partition"] == "design" for cell in design)
          assert all(cell["partition"] == "qualification" for cell in qualification)
          assert packet["roots"]["revision1_registry_sha256"] == (
              "81da1bb9414e7c53e42bbf65b198aa61d8bb7ed3f81eb2bf5813a1edff245ac4"
          )
          assert packet["roots"]["qualification_seed_registry_sha256"] == (
              "247db21c869703f5604e63678f0cf614f0b88040a05ce42c61629ddf712cefd5"
          )
          assert packet["roots"]["definition_lock_root_sha256"] == (
              "71d2ed7a9f45c55bf17ec518c08b5d0b827a7cf0ae2cc3c339dc09197c55f633"
          )
          assert packet["matrix_counts"] == {
              "design": {"admitted": 99, "rejected": 13},
              "qualification": {"admitted": 100, "rejected": 12},
          }
          assert {
              profile["profile_id"]: profile["revision1_profile_admitted"]
              for profile in profiles
          } == {
              "revision1_balanced_reference_v1": True,
              "revision1_colour_shift_v1": True,
              "revision1_checker_low_v1": True,
              "revision1_checker_high_v1": True,
              "revision1_stripes_low_v1": False,
              "revision1_illumination_shift_v1": False,
              "revision1_combined_stress_v1": True,
          }
          assert {
              key: packet["roots"][key]
              for key in {
                  "procedural_asset_root_sha256",
                  "appearance_assignment_root_sha256",
                  "portable_analytic_identity_root_sha256",
                  "within_renderer_invariance_outcome_root_sha256",
                  "design_partition_outcome_root_sha256",
                  "qualification_partition_outcome_root_sha256",
              }
          } == {
              "procedural_asset_root_sha256": (
                  "bd563c543c1dffdd9038e86cb1aa6d97da566fa016d6f6683b11f4964d433ec0"
              ),
              "appearance_assignment_root_sha256": (
                  "9b7118e4faffb2a74980e9c1ca85b4758abafad6dd7e739b9b68af0224010523"
              ),
              "portable_analytic_identity_root_sha256": (
                  "87459ac7f5f09b222ed029afaf3751881398917eb6184c86ce9305902f76ad4e"
              ),
              "within_renderer_invariance_outcome_root_sha256": (
                  "6bad73a2b68310d2e7b3a19f91dc83d94f15213a91b0955dd541d3d22d5bb100"
              ),
              "design_partition_outcome_root_sha256": (
                  "826545aa75737fd8d041b703fcf380e16791a70411c2bcb1c38f783a0fa9916c"
              ),
              "qualification_partition_outcome_root_sha256": (
                  "fa976fb849d0037af7bcc8d63d1c554099ecc3f1061fd8ad98cd8d7cc8c3177c"
              ),
          }
          print("Design matrix outcomes:", packet["matrix_counts"]["design"])
          print("Qualification matrix outcomes:", packet["matrix_counts"]["qualification"])
          print(
              "Profile admission outcomes:",
              {
                  profile["profile_id"]: profile["revision1_profile_admitted"]
                  for profile in profiles
              },
          )
          print(
              "Portable revision roots:",
              {
                  key: value
                  for key, value in packet["roots"].items()
                  if key in {
                      "portable_analytic_identity_root_sha256",
                      "within_renderer_invariance_outcome_root_sha256",
                      "design_partition_outcome_root_sha256",
                      "qualification_partition_outcome_root_sha256",
                  }
              },
          )
          print(
              "Renderer-local revision roots (reported, not compared):",
              {
                  key: value
                  for key, value in packet["roots"].items()
                  if key in {
                      "renderer_local_ecological_label_root_sha256",
                      "renderer_specific_audit_root_sha256",
                  }
              },
          )
          PY
