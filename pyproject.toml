[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epsbench"
version = "0.1.0"
description = "A small benchmark for ecological predictive-state research."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mujoco>=3.3.5,<4",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.scripts]
epsbench = "epsbench.cli.app:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epsbench"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=epsbench --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "integration: exercises MuJoCo rendering and filesystem integration",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["epsbench"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mujoco.*"]
ignore_missing_imports = true
